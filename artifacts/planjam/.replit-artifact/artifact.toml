kind = "web"
previewPath = "/"
title = "PlanJam"
description = "A playful group-planning app that turns four friends' preferences into one shared plan through quick picks, smart matches, and a final vote."
version = "1.0.0"
id = "artifacts/planjam"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21300

[services.development]
run = "pnpm --filter @workspace/planjam run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/planjam", "run", "build" ]
serve = "static"
publicDir = "artifacts/planjam/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21300"
BASE_PATH = "/"
